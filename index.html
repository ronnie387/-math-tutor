<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學自學平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --accent2: #2980b9;
    --gold: #d4a017;
    --muted: #6b6b7a;
    --card: #fffdf7;
    --border: #d8cfc0;
    --green: #27ae60;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
  }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    text-align: center;
  }
  .login-logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 2rem; font-weight: 700;
    margin-bottom: 6px;
  }
  .login-sub {
    font-size: 0.85rem; color: var(--muted);
    margin-bottom: 40px;
  }
  .login-label {
    font-size: 10px; letter-spacing: 3px; color: var(--accent);
    font-weight: 600; text-transform: uppercase;
    text-align: left; margin-bottom: 8px; display: block;
  }
  .login-input {
    width: 100%; padding: 13px 16px;
    border: 1.5px solid var(--border); border-radius: 6px;
    font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem;
    background: white; color: var(--ink);
    transition: border-color 0.2s; margin-bottom: 14px;
  }
  .login-input:focus { outline: none; border-color: var(--accent2); }
  .login-btn {
    width: 100%; padding: 13px;
    background: var(--ink); color: white;
    border: none; border-radius: 6px; cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 0.95rem; font-weight: 500;
    transition: background 0.2s;
  }
  .login-btn:hover { background: #2d2d4a; }
  .login-btn:disabled { background: var(--muted); cursor: not-allowed; }

  /* OTP 輸入 */
  #otp-section { display: none; }
  .otp-hint {
    font-size: 0.85rem; color: var(--muted);
    margin-bottom: 20px; line-height: 1.7;
  }
  .otp-input {
    width: 100%; padding: 16px;
    border: 1.5px solid var(--border); border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.8rem; letter-spacing: 12px;
    text-align: center; background: white; color: var(--ink);
    transition: border-color 0.2s; margin-bottom: 14px;
  }
  .otp-input:focus { outline: none; border-color: var(--accent2); }

  .login-msg {
    margin-top: 14px; font-size: 0.85rem;
    padding: 10px 14px; border-radius: 6px; display: none;
  }
  .login-msg.ok { background: #f0faf5; color: #1d7a45; display: block; }
  .login-msg.err { background: #fff5f5; color: #9b2335; display: block; }

  /* ── MAIN APP ── */
  #app-screen { display: none; }

  .top-bar {
    background: var(--ink); color: #f0ece0;
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .top-bar .logo {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.1rem; font-weight: 700;
  }
  .top-bar .user-info {
    font-size: 0.82rem; color: #aaa;
    display: flex; align-items: center; gap: 16px;
  }
  .logout-btn {
    background: none; border: 1px solid #555;
    color: #ccc; padding: 5px 12px; border-radius: 4px;
    cursor: pointer; font-size: 0.78rem;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: #aaa; color: white; }

  .app-wrap {
    max-width: 860px; margin: 0 auto;
    padding: 52px 28px 80px;
  }
  .app-header { margin-bottom: 40px; }
  .app-header .greeting {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.8rem; font-weight: 700; margin-bottom: 6px;
  }
  .app-header .sub { font-size: 0.9rem; color: var(--muted); }

  /* ── 金句輪播 ── */
  .quote-bar {
    background: white;
    border: 1.5px solid var(--border);
    border-left: 5px solid var(--gold);
    border-radius: 6px;
    padding: 16px 20px;
    margin-bottom: 40px;
    display: flex; align-items: center; gap: 12px;
  }
  .quote-bar .q-icon { font-size: 1.2rem; flex-shrink: 0; }
  #quote-text {
    font-style: italic; font-size: 0.9rem; color: #3a3a4a;
    opacity: 1; transition: opacity 0.5s; flex: 1;
  }
  #quote-source {
    font-size: 0.75rem; color: var(--muted);
    font-style: normal; margin-left: 8px; white-space: nowrap;
  }

  /* ── 主題卡片 ── */
  .section-label {
    font-size: 10px; letter-spacing: 3px; color: var(--accent);
    font-weight: 600; text-transform: uppercase; margin-bottom: 16px;
  }
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .topic-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px; padding: 24px;
    cursor: pointer; text-decoration: none; color: var(--ink);
    transition: all 0.2s; position: relative; overflow: hidden;
    display: block;
  }
  .topic-card:hover {
    border-color: var(--accent2);
    box-shadow: 0 4px 20px rgba(41,128,185,0.12);
    transform: translateY(-2px);
  }
  .topic-card.done { border-color: var(--green); }
  .topic-card.done::after {
    content: '✓'; position: absolute; top: 14px; right: 16px;
    color: var(--green); font-size: 1rem; font-weight: 700;
  }
  .topic-card.locked { opacity: 0.5; cursor: not-allowed; }
  .topic-card.locked:hover { transform: none; box-shadow: none; border-color: var(--border); }
  .topic-tag {
    font-size: 9px; letter-spacing: 2px; color: var(--accent2);
    font-weight: 700; text-transform: uppercase; margin-bottom: 10px;
  }
  .topic-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.15rem; font-weight: 700; margin-bottom: 8px;
  }
  .topic-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .topic-score {
    margin-top: 14px; font-size: 0.78rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--green);
  }

  /* ── Loading ── */
  .loading {
    text-align: center; padding: 60px;
    color: var(--muted); font-size: 0.9rem;
  }

  @media (max-width: 560px) {
    .login-card { padding: 36px 24px; }
    .top-bar { padding: 12px 16px; }
    .app-wrap { padding: 32px 16px 60px; }
  }
</style>
</head>
<body>

<!-- ── 登入畫面 ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">數學自學平台</div>
    <div class="login-sub">Math Tutor · 高中線性代數</div>

    <!-- Step 1: 輸入 email -->
    <div id="email-section">
      <label class="login-label">你的 Email</label>
      <input type="email" id="email-input" class="login-input" placeholder="輸入你的 email">
      <button class="login-btn" id="send-otp-btn" onclick="sendOTP()">傳送驗證碼</button>
      <div class="login-msg" id="login-msg"></div>
    </div>

    <!-- Step 2: 輸入 OTP -->
    <div id="otp-section">
      <p class="otp-hint" id="otp-hint"></p>
      <label class="login-label">6 位數驗證碼</label>
      <input type="text" id="otp-input" class="otp-input" placeholder="00000000" maxlength="8" inputmode="numeric">
      <button class="login-btn" id="verify-btn" onclick="verifyOTP()">驗證並進入</button>
      <div class="login-msg" id="otp-msg"></div>
    </div>
  </div>
</div>

<!-- ── 主畫面 ── -->
<div id="app-screen">
  <div class="top-bar">
    <div class="logo">數學自學平台</div>
    <div class="user-info">
      <span id="user-email-display"></span>
      <button class="logout-btn" onclick="logout()">登出</button>
    </div>
  </div>

  <div class="app-wrap">
    <div class="app-header">
      <div class="greeting" id="greeting">你好！</div>
      <div class="sub">選一個主題開始學習，或繼續複習已完成的單元。</div>
    </div>

    <!-- 金句輪播 -->
    <div class="quote-bar">
      <span class="q-icon">✦</span>
      <span id="quote-text">載入中…</span>
      <span id="quote-source"></span>
    </div>

    <!-- 主題清單 -->
    <div class="section-label">學習主題</div>
    <div class="topics-grid" id="topics-grid">
      <div class="loading">載入中…</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://erabqvmiffpecaizmchh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_3Ytw_g_yk-AbX4GWOU9DEw_YXM8x2z3';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// 預設主題（之後可從 Supabase 管理）
const DEFAULT_TOPICS = [
  {
    id: 'transition-matrix',
    tag: '線性代數 01',
    title: '轉移矩陣',
    desc: '用族群遷移理解矩陣如何描述狀態之間的轉換。',
    file: 'transition-matrix-reading.html',
    available: true
  },
  {
    id: 'reflection-matrix',
    tag: '線性代數 02',
    title: '鏡射矩陣',
    desc: '用鏡子反射理解矩陣如何對 x 軸、y 軸、y=x 作鏡射變換。',
    file: 'reflection-matrix-reading.html',
    available: true
  },
  {
    id: 'rotation-matrix',
    tag: '線性代數 03',
    title: '旋轉矩陣',
    desc: '用時鐘指針理解 cosθ、sinθ 如何描述平面上的旋轉。',
    file: 'rotation-matrix-reading.html',
    available: true
  }
];

let currentUser = null;

// ── 初始化：檢查是否已登入 ──
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    currentUser = session.user;
    showApp();
  }

  // 監聽 auth 狀態變化
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      currentUser = session.user;
      showApp();
    } else if (event === 'SIGNED_OUT') {
      showLogin();
    }
  });
}

// ── 傳送 OTP ──
async function sendOTP() {
  const email = document.getElementById('email-input').value.trim();
  if (!email) return;

  const btn = document.getElementById('send-otp-btn');
  btn.disabled = true; btn.textContent = '傳送中…';

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: true }
  });

  if (error) {
    showMsg('login-msg', '傳送失敗：' + error.message, 'err');
    btn.disabled = false; btn.textContent = '傳送驗證碼';
  } else {
    document.getElementById('email-section').style.display = 'none';
    document.getElementById('otp-section').style.display = 'block';
    document.getElementById('otp-hint').textContent =
      `驗證碼已寄到 ${email}，請查收信件（可能在垃圾郵件）。`;
    // 儲存 email 供後續使用
    window._loginEmail = email;
  }
}

// ── 驗證 OTP ──
async function verifyOTP() {
  const token = document.getElementById('otp-input').value.trim();
  if (token.length !== 8) return;

  const btn = document.getElementById('verify-btn');
  btn.disabled = true; btn.textContent = '驗證中…';

  const { error } = await sb.auth.verifyOtp({
    email: window._loginEmail,
    token,
    type: 'email'
  });

  if (error) {
    showMsg('otp-msg', '驗證失敗，請確認驗證碼是否正確。', 'err');
    btn.disabled = false; btn.textContent = '驗證並進入';
  }
  // 成功的話 onAuthStateChange 會觸發 showApp()
}

// ── 顯示主畫面 ──
async function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';

  const email = currentUser.email;
  document.getElementById('user-email-display').textContent = email;
  document.getElementById('greeting').textContent =
    '你好，' + email.split('@')[0] + '！';

  loadQuotes();
  loadTopics();
}

// ── 登出 ──
async function logout() {
  await sb.auth.signOut();
}

function showLogin() {
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

// ── 金句輪播 ──
let quotes = [];
let quoteIdx = 0;

async function loadQuotes() {
  const { data } = await sb.from('quotes').select('*').eq('active', true);
  if (data && data.length > 0) {
    quotes = data;
  } else {
    quotes = [
      { content: "It's me, hi, I'm the problem, it's me.", source: "Anti-Hero" },
      { content: "Everything you lose is a step you take.", source: "Clean" },
      { content: "What died didn't stay dead.", source: "The 1" }
    ];
  }
  showQuote();
  setInterval(rotateQuote, 5000);
}

function showQuote() {
  const q = quotes[quoteIdx];
  document.getElementById('quote-text').textContent = '"' + q.content + '"';
  document.getElementById('quote-source').textContent = '— ' + q.source;
}

function rotateQuote() {
  const el = document.getElementById('quote-text');
  el.style.opacity = 0;
  setTimeout(() => {
    quoteIdx = (quoteIdx + 1) % quotes.length;
    showQuote();
    el.style.opacity = 1;
  }, 500);
}

// ── 主題清單 ──
async function loadTopics() {
  // 抓這個學生的答題紀錄
  const { data: answers } = await sb
    .from('answers')
    .select('topic, score')
    .eq('user_id', currentUser.id);

  const doneTopics = {};
  if (answers) {
    answers.forEach(a => { doneTopics[a.topic] = a.score; });
  }

  const grid = document.getElementById('topics-grid');
  grid.innerHTML = '';

  DEFAULT_TOPICS.forEach(topic => {
    const isDone = doneTopics[topic.id] !== undefined;
    const score = doneTopics[topic.id];

    const card = document.createElement('a');
    card.className = 'topic-card' +
      (isDone ? ' done' : '') +
      (!topic.available ? ' locked' : '');

    if (topic.available && topic.file) {
      card.href = topic.file + '?uid=' + currentUser.id;
    } else {
      card.href = '#';
      card.onclick = e => { if (!topic.available) e.preventDefault(); };
    }

    card.innerHTML = `
      <div class="topic-tag">${topic.tag}</div>
      <div class="topic-title">${topic.title}</div>
      <div class="topic-desc">${topic.desc}</div>
      ${isDone ? `<div class="topic-score">得分 ${score}/3 ✓</div>` : ''}
      ${!topic.available ? '<div class="topic-score" style="color:var(--muted)">即將推出</div>' : ''}
    `;
    grid.appendChild(card);
  });
}

// ── 工具 ──
function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'login-msg ' + type;
}

init();
</script>
</body>
</html>
